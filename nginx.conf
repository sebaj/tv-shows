server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Los assets de Vite llevan hash en el nombre: cachear agresivamente.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta (/peliculas, /detalle/..., /agenda) sirve index.html
    # y React Router resuelve del lado del cliente.
    location / {
        try_files $uri /index.html;
    }
}
